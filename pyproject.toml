[project]
name = "finsight"
version = "0.1.0"
description = "Citation-grounded financial document agent — LangGraph, hybrid RAG, verified arithmetic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "langfuse>=4.13.0",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "litellm>=1.70",
    "mcp>=1.28.1",
    "pydantic-settings>=2.4",
    "pymupdf>=1.28.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "qdrant-client>=1.18.0",
    "uvicorn>=0.50.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "websockets>=15.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finsight.prompts" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
