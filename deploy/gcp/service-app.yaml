# finsight app — Cloud Run multi-container service (week-4 sidecar pattern):
#   agent (ingress :8000) ──localhost──▶ mcp sidecar (:3000) ──▶ qdrant sidecar (:6333)
# Self-contained demo deployment. For async ingestion the store must be EXTERNAL:
# the Pub/Sub worker is a separate service and cannot reach a sidecar (see deploy.md).
# Every model role runs on VERTEX AI via the service account — no API keys in the image.
# Deploy:  envsubst < service-app.yaml | gcloud run services replace - --region=$REGION
# Requires env: PROJECT_ID, IMAGE (full Artifact Registry tag), SA_EMAIL

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: finsight
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/maxScale: "2"          # cost guard
        run.googleapis.com/container-dependencies: '{"agent":["mcp"],"mcp":["qdrant"]}'
        # keep CPU allocated between requests so background work (trace export,
        # in-flight background ingest threads) can finish — reference-course pattern
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: ${SA_EMAIL}
      containers:
        - name: agent
          image: ${IMAGE}
          ports:
            - containerPort: 8000
          env:
            - name: MCP_SERVER_URL
              value: "http://localhost:3000/mcp/"
            # Self-contained demo: Qdrant runs as a sidecar in this service. Documents
            # uploaded through the UI are indexed and queried entirely in-service.
            # PRODUCTION / async ingestion: point QDRANT_URL at Qdrant Cloud instead —
            # the Pub/Sub worker is a separate service and cannot reach a sidecar.
            - name: QDRANT_URL
              value: "http://localhost:6333"
            - name: QDRANT_COLLECTION
              value: "finsight_chunks"
            - name: CHECKPOINT
              value: "memory"
            - name: GOOGLE_CLOUD_PROJECT
              value: "${PROJECT_ID}"
            # Every role runs on Vertex, authenticated by the attached service account:
            # the deployed service holds NO model API keys at all. Scaling is a config
            # change, and there is no key to leak, rotate, or exhaust.
            - name: LLM_ANSWER
              value: "vertex_ai/gemini-2.5-flash"
            - name: LLM_FAST
              value: "vertex_ai/gemini-2.5-flash"
            - name: LLM_VISION
              value: "vertex_ai/gemini-2.5-flash"
            - name: LLM_JUDGE
              value: "vertex_ai/gemini-2.5-flash"
            # ── DEMO PROFILE: keep ingest light on free-tier keys. These two features
            # fire one LLM call per chunk/crop at ingest time — great for eval corpora,
            # but they saturate trial rate limits and stall the first questions.
            # Flip to "1" (or remove) for quality corpus builds via the ingest worker.
            - name: CONTEXTUAL_CHUNKS
              value: "0"
            - name: ENRICH_BLOCKS
              value: "0"
            - name: GROQ_API_KEY
              valueFrom: {secretKeyRef: {name: GROQ_API_KEY, key: latest}}
            - name: COHERE_API_KEY
              valueFrom: {secretKeyRef: {name: COHERE_API_KEY, key: latest}}
            # ── Production tracing (Langfuse) — uncomment AFTER creating the two
            # secrets (gcloud secrets create LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY);
            # a secretKeyRef to a missing secret fails the whole deploy.
            # - name: LANGFUSE_HOST
            #   value: "https://cloud.langfuse.com"
            # - name: LANGFUSE_PUBLIC_KEY
            #   valueFrom: {secretKeyRef: {name: LANGFUSE_PUBLIC_KEY, key: latest}}
            # - name: LANGFUSE_SECRET_KEY
            #   valueFrom: {secretKeyRef: {name: LANGFUSE_SECRET_KEY, key: latest}}
          resources:
            limits: {memory: 1Gi, cpu: "1"}

        # retrieval sidecar — same image, MCP entrypoint, localhost-only
        - name: mcp
          image: ${IMAGE}
          command: ["python", "-m", "finsight.mcp_server.main"]
          env:
            - name: MCP_PORT
              value: "3000"
            # Self-contained demo: Qdrant runs as a sidecar in this service. Documents
            # uploaded through the UI are indexed and queried entirely in-service.
            # PRODUCTION / async ingestion: point QDRANT_URL at Qdrant Cloud instead —
            # the Pub/Sub worker is a separate service and cannot reach a sidecar.
            - name: QDRANT_URL
              value: "http://localhost:6333"
            - name: QDRANT_COLLECTION
              value: "finsight_chunks"
            - name: COHERE_API_KEY
              valueFrom: {secretKeyRef: {name: COHERE_API_KEY, key: latest}}
          resources:
            limits: {memory: 512Mi, cpu: "1"}
          startupProbe:                       # required: agent depends_on this container
            tcpSocket: {port: 3000}
            periodSeconds: 5
            failureThreshold: 30

        # vector store sidecar — ephemeral across scale-to-zero, which is fine for a
        # demo: documents are uploaded live. Swap for Qdrant Cloud when the ingest
        # worker must share the index.
        - name: qdrant
          image: qdrant/qdrant:latest
          resources:
            limits: {memory: 512Mi, cpu: "1"}
          startupProbe:
            tcpSocket: {port: 6333}
            periodSeconds: 5
            failureThreshold: 30
